name: Update USAspending Data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Assistance Listings CSV
        run: |
          mkdir -p data
          curl -L "https://files.usaspending.gov/reference_data/assistance_listings.csv" -o data/assistance_listings.csv

      - name: Commit updated data
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/assistance_listings.csv
          git commit -m "Update USAspending data" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
